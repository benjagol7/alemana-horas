name: Revisar horas Clinica Alemana

# Sin "schedule": lo dispara cron-job.org llamando a la API de GitHub.
# El botón "Run workflow" sigue funcionando para correrlo a mano.
on:
  workflow_dispatch:

# Si una corrida sigue en curso cuando llega la siguiente, espera en vez de pisarse.
concurrency:
  group: revisar-horas
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cachear navegador
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v1

      - name: Instalar dependencias
        run: |
          pip install playwright requests
          python -m playwright install --with-deps chromium

      - name: Revisar disponibilidad
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          RUT_PACIENTE: ${{ secrets.RUT_PACIENTE }}
        run: python check.py
