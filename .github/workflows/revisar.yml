name: Revisar horas Clinica Alemana

# Sin "schedule": lo dispara cron-job.org llamando a la API de GitHub.
# El botón "Run workflow" sigue funcionando para correrlo a mano.
on:
  workflow_dispatch:

# Si una corrida sigue en curso cuando llega la siguiente, espera en vez de pisarse.
concurrency:
  group: revisar-horas
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Revisar disponibilidad
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python check.py
